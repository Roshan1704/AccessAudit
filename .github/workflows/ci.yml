name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: accessaudit
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: accessaudit
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U accessaudit" --health-interval 5s --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgresql://accessaudit:ci_only_password@localhost:5432/accessaudit
      TEST_DATABASE_URL: postgresql://aa_api:ci_only_api_password@localhost:5432/accessaudit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsc -b --force
      - run: npx eslint . --max-warnings=0
      - run: npx prettier --check .
      - run: npm run db:migrate
      - name: Set CI-only login role password
        run: psql "$MIGRATION_DATABASE_URL" -c "ALTER ROLE aa_api LOGIN PASSWORD 'ci_only_api_password'"
      - run: npx vitest run
      - run: npm run build -w @accessaudit/web
      - name: E2E (Playwright, installed Chrome)
        run: npx playwright test
        env:
          DATABASE_URL: postgresql://aa_api:ci_only_api_password@localhost:5432/accessaudit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
